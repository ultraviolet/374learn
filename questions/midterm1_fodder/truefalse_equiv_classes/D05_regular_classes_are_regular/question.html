<markdown>
Check **"Yes"** if the following statement is **always true**, or **"No"** otherwise.
Give a brief explanation of your answer.

---

**For every regular language $L$, each equivalence class of $\equiv_L$ is itself a regular language.**
</markdown>
</pl-question-panel>

<pl-multiple-choice answers-name="ans" weight="1" fixed-order="true">
    <pl-answer correct="true" feedback="Correct! For a regular $L$ with minimal DFA $M$, the equivalence classes of $\equiv_L$ are exactly $\{w \mid \delta^*(q_0, w) = q\}$ for each state $q$. Each such set is recognized by a DFA identical to $M$ except with only $q$ as the accepting state, so each class is regular.">Yes</pl-answer>
    <pl-answer correct="false" feedback="Each class of $\equiv_L$ for a regular $L$ corresponds to a state in the minimal DFA. The strings reaching a given state form a regular language (build a DFA that accepts exactly those strings), so every equivalence class is regular.">No</pl-answer>
</pl-multiple-choice>
