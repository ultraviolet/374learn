<markdown>
Check **"Yes"** if the following statement is **always true**, or **"No"** otherwise.
Give a brief explanation of your answer.

---

**For all languages $L \subseteq \Sigma^*$, if $L$ is regular, then $\Sigma^* \setminus L$ is not regular.**
</markdown>
</pl-question-panel>

<pl-multiple-choice answers-name="ans" weight="1" fixed-order="true">
    <pl-answer correct="false" feedback="The complement of a regular language is always regular, not non-regular. Counterexample: $L = \{0,1\}^*$ is regular, and $\Sigma^* \setminus L = \emptyset$ is also regular. (In fact, the complement of any regular language is regular.)">Yes</pl-answer>
    <pl-answer correct="true" feedback="Correct! The complement of a regular language is always regular (B.5). So the statement 'if $L$ is regular then $\Sigma^* \setminus L$ is not regular' is always false.">No</pl-answer>
</pl-multiple-choice>
