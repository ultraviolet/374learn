Check **"Yes"** if the following statement is **always true**, or **"No"** otherwise.
Give a brief explanation of your answer.

---

**If $L$ is regular and $L \cup L'$ is regular, then $L'$ is regular.**
</markdown>
</pl-question-panel>

<pl-multiple-choice answers-name="ans" weight="1" fixed-order="true">
    <pl-answer correct="false" feedback="Counterexample: Let $L = \Sigma^*$ (regular) and $L' = \{0^n1^n \mid n \geq 0\}$ (non-regular). Then $L \cup L' = \Sigma^*$ (regular). So $L$ is regular, $L \cup L'$ is regular, but $L'$ is not regular.">Yes</pl-answer>
    <pl-answer correct="true" feedback="Correct! If $L = \Sigma^*$, then $L \cup L' = \Sigma^*$ for any $L'$, making $L \cup L'$ regular regardless of whether $L'$ is regular or not.">No</pl-answer>
