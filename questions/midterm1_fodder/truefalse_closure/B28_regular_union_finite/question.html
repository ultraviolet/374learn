Check **"Yes"** if the following statement is **always true**, or **"No"** otherwise.
Give a brief explanation of your answer.

---

**If $L$ is regular and $L'$ is finite, then $L \cup L'$ is regular.**
</markdown>
</pl-question-panel>

<pl-multiple-choice answers-name="ans" weight="1" fixed-order="true">
    <pl-answer correct="true" feedback="Correct! Every finite language is regular (B.14). Since $L'$ is finite, $L'$ is regular. Since both $L$ and $L'$ are regular, their union $L \cup L'$ is regular by closure under union (B.2).">Yes</pl-answer>
    <pl-answer correct="false" feedback="Every finite language is regular, and regular languages are closed under union. So $L \cup L'$ is regular when $L$ is regular and $L'$ is finite.">No</pl-answer>
