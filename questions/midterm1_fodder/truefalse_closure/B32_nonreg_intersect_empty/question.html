Check **"Yes"** if the following statement is **always true**, or **"No"** otherwise.
Give a brief explanation of your answer.

---

**If $L$ is not regular and $L \cap L' = \emptyset$, then $L'$ is regular.**
</markdown>
</pl-question-panel>

<pl-multiple-choice answers-name="ans" weight="1" fixed-order="true">
    <pl-answer correct="false" feedback="Counterexample: Let $L = \{0^n1^n \mid n \geq 0\}$ (not regular) and $L' = \Sigma^* \setminus L$ (also not regular). Then $L \cap L' = \emptyset$. Both are non-regular yet their intersection is empty.">Yes</pl-answer>
    <pl-answer correct="true" feedback="Correct! Take $L = \{0^n1^n\}$ (not regular) and $L' = \Sigma^* \setminus L$ (also not regular). Their intersection is $\emptyset$, but $L'$ is not regular.">No</pl-answer>
