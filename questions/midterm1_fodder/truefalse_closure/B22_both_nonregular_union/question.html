---

**If $L$ and $L'$ are not regular, then $L \cup L'$ is not regular.**

    <pl-answer correct="true" feedback="Correct! A non-regular language and its complement are both non-regular, yet their union is $\Sigma^*$, which is regular.">No</pl-answer>
