<markdown>
Check **"Yes"** if the following statement is **always true**, or **"No"** otherwise.
Give a brief explanation of your answer.

---

**For all regular languages $L$ and $L'$, the language $L \cup L'$ is regular.**
</markdown>
</pl-question-panel>

<pl-multiple-choice answers-name="ans" weight="1" fixed-order="true">
    <pl-answer correct="true" feedback="Correct! Regular languages are closed under union. If $R$ is a regular expression for $L$ and $R'$ is a regular expression for $L'$, then $R + R'$ (or $R \mid R'$) is a regular expression for $L \cup L'$. Alternatively, build an NFA that nondeterministically runs either the NFA for $L$ or the NFA for $L'$.">Yes</pl-answer>
    <pl-answer correct="false" feedback="Regular languages are closed under union. This is one of the basic closure properties: if $L$ and $L'$ are regular, then $L \cup L'$ is also regular.">No</pl-answer>
</pl-multiple-choice>
