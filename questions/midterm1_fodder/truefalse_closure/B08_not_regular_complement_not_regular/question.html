**For all languages $L \subseteq \Sigma^*$, if $L$ is not regular, then $\Sigma^* \setminus L$ is not regular.**

    <pl-answer correct="false" feedback="Use a proof by contradiction: if $\Sigma^* \setminus L$ were regular, then $L = \Sigma^* \setminus (\Sigma^* \setminus L)$ would be regular by closure under complement.">No</pl-answer>
