Check **"Yes"** if the following statement is **always true**, or **"No"** otherwise.
Give a brief explanation of your answer.

---

**If $L$ is regular and $L \cap L'$ is regular, then $L'$ is regular.**
</markdown>
</pl-question-panel>

<pl-multiple-choice answers-name="ans" weight="1" fixed-order="true">
    <pl-answer correct="false" feedback="Counterexample: Let $L = \emptyset$ (regular) and $L' = \{0^n1^n \mid n \geq 0\}$ (not regular). Then $L \cap L' = \emptyset$ (regular). So $L$ is regular, $L \cap L'$ is regular, but $L'$ is not regular.">Yes</pl-answer>
    <pl-answer correct="true" feedback="Correct! If $L = \emptyset$, then $L \cap L' = \emptyset$ is regular for any $L'$, including non-regular ones. Knowing $L$ is regular and $L \cap L'$ is regular tells us nothing about $L'$ in general.">No</pl-answer>
