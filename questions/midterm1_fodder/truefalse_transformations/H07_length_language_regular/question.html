Give a brief explanation of your answer.

---

**For every regular language $L$, the language $\{0^{|w|} \mid w \in L\}$ is also regular.**
</markdown>
</pl-question-panel>

<pl-multiple-choice answers-name="ans" weight="1" fixed-order="true">
    <pl-answer correct="true" feedback="Correct! The map $h : \Sigma^* \to \{0\}^*$ defined by $h(a) = 0$ for every $a \in \Sigma$ is a homomorphism. The image $h(L) = \{0^{|w|} \mid w \in L\}$ is regular since regular languages are closed under homomorphisms.">Yes</pl-answer>
    <pl-answer correct="false" feedback="The length-language $\{0^{|w|} \mid w \in L\}$ is the image of $L$ under the homomorphism that maps every symbol to $\mathtt{0}$. Regular languages are closed under homomorphisms.">No</pl-answer>
