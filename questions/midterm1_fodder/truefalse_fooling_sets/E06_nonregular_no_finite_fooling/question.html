---

**If a language $L$ is not regular, then $L$ has no finite fooling set.**
</markdown>
</pl-question-panel>

<pl-multiple-choice answers-name="ans" weight="1" fixed-order="true">
    <pl-answer correct="false" feedback="Counterexample: $L = \{0^n 1^n \mid n \geq 0\}$ is not regular, yet $\{(0, 1), (00, 11)\}$ is a finite fooling set of size 2: $01, 0011 \in L$, and $0 \cdot 11 = 011 \notin L$. In fact, non-regular languages have fooling sets of every finite size—and an infinite one too.">Yes</pl-answer>
    <pl-answer correct="true" feedback="Correct! Non-regular languages have both infinite fooling sets AND finite ones. Any finite subset of an infinite fooling set is itself a finite fooling set. So non-regular languages have fooling sets of all sizes $n \geq 1$.">No</pl-answer>
