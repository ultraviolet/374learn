---

**If a language $L$ is regular, then $L$ has no infinite fooling set.**
</markdown>

    <pl-answer correct="false" feedback="By the Fooling Set Lemma, an infinite fooling set would force infinitely many DFA states, making $L$ non-regular. So regular languages cannot have infinite fooling sets.">No</pl-answer>
