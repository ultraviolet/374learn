Give a brief explanation of your answer.

---

**For every language $L$, if for every string $w \in L$ there is a DFA that accepts $w$, then $L$ is regular.**

<pl-multiple-choice answers-name="ans" weight="1" fixed-order="true">
    <pl-answer correct="false" feedback="The condition is trivially true for every language $L$: for any $w \in L$, the all-accepting DFA (or a DFA for the singleton $\{w\}$) accepts $w$. But $L$ might be non-regular. The condition says nothing useful, since each DFA is only required to accept one string at a time, not to recognize all of $L$ simultaneously.">Yes</pl-answer>
