Give a brief explanation of your answer.

---

**For every language $L$, if $L$ is not regular then $L$ cannot be represented by a regular expression.**
</markdown>

    <pl-answer correct="false" feedback="This is the contrapositive of: if $L$ has a regular expression, then $L$ is regular. Since that statement is true, its contrapositive is also true.">No</pl-answer>
