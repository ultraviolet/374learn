---

**The language $\{w \cdot 0^{\#(0,w)} \mid w \in \{0,1\}^*\}$ is regular.**

*(Here $\#(0,w)$ denotes the number of $\mathtt{0}$s in $w$.)*
</markdown>

    <pl-answer correct="false" feedback="The language is NOT regular. Fooling set: $\{(0^n 1,\, 0^n) \mid n \geq 0\}$. Each $0^n 1 \cdot 0^n$ is in the language (take $w = 0^n 1$, which has $n$ zeros, and the suffix is $0^n$ ✓). For $n \neq m$: $0^n 1 \cdot 0^m$ is in the language only if the unique way to write it as $w \cdot 0^{\#(0,w)}$ gives $m = n$. Since the only $\mathtt{1}$ in the string forces the split, $0^n 1 \cdot 0^m \notin L$ for $n \neq m$.">Yes</pl-answer>
