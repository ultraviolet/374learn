---

**For every context-free language $L$, the language $L^*$ is also context-free.**
</markdown>

    <pl-answer correct="false" feedback="CFLs are closed under Kleene star. Add a new start symbol with productions $S' \to \varepsilon \mid S' S$ where $S$ is the original start.">No</pl-answer>
