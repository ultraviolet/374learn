---

**The regular expressions $(00+11)^*$ and $(00)^*(11)^*$ describe the same language.**

    <pl-answer correct="true" feedback="Correct! Counterexample: $1100 \in (00+11)^*$ (decompose as $11 \cdot 00$), but $1100 \notin (00)^*(11)^*$ because $(00)^*(11)^*$ requires all the $00$-blocks to appear before any $11$-blocks.">No</pl-answer>
