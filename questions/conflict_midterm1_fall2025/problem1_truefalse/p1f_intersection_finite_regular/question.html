<markdown>
Check **"Yes"** if the following statement is **always true**, or **"No"** otherwise.
Give a brief explanation of your answer.

---

**For any language $L$ and any finite language $L'$, the language $L \cap L'$ is regular.**
</markdown>
</pl-question-panel>

<pl-multiple-choice answers-name="ans" weight="1" fixed-order="true">
    <pl-answer correct="true" feedback="Correct! Every finite language is regular (it can be described by a finite union of string literals). Since $L'$ is regular and regular languages are closed under intersection, $L \cap L'$ is a subset of $L'$ and therefore finite, hence regular. Alternatively: $L \cap L' \subseteq L'$, which is finite, so $L \cap L'$ is also finite, and every finite language is regular.">Yes</pl-answer>
    <pl-answer correct="false" feedback="Think about what $L \cap L'$ can contain: it must be a subset of $L'$. If $L'$ is finite, what can you say about $L \cap L'$?">No</pl-answer>
</pl-multiple-choice>
